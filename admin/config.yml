backend:
  name: git-gateway
  branch: main

media_folder: "assets/images/uploads"
public_folder: "assets/images/uploads"

collections:
  - name: "animals"
    label: "Animals"
    folder: "_animals"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Animal Name", name: "name", widget: "string", hint: "e.g. Biscuit, Leo, White Persian" }
      - label: "Type"
        name: "type"
        widget: "select"
        options: ["Cat", "Dog"]
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - { label: "For Adoption", value: "adoption" }
          - { label: "Rescued Stray", value: "stray" }
          - { label: "Urgent Care Needed", value: "urgent" }
          - { label: "Adopted", value: "adopted" }
      - label: "Gender"
        name: "gender"
        widget: "select"
        options: ["Male", "Female", "Unknown"]
        default: "Unknown"
      - { label: "Age", name: "age", widget: "string", hint: "e.g. 2 years, 4 months, Unknown", required: false }
      - { label: "Breed", name: "breed", widget: "string", required: false, hint: "e.g. Persian, Labrador, Turkish Angora, Domestic" }
      - label: "Neutered / Spayed?"
        name: "neutered"
        widget: "select"
        options: ["Yes", "No", "Unknown"]
        default: "Unknown"
      - label: "Vaccinated?"
        name: "vaccinated"
        widget: "select"
        options: ["Yes", "No", "Unknown"]
        default: "Unknown"
      - label: "Litter Box Trained?"
        name: "litter_trained"
        widget: "select"
        options: ["Yes", "No", "N/A", "Unknown"]
        default: "Unknown"
      - { label: "Location", name: "location", widget: "string", hint: "e.g. Islamabad - Phase 2, Lahore, Askari 11" }
      - { label: "Contact Person", name: "contact", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Special Instructions", name: "special_instructions", widget: "text", required: false, hint: "Medical needs, dietary requirements, behavioural notes etc." }
      - label: "Urgent?"
        name: "urgent"
        widget: "boolean"
        default: false
        required: false
      - label: "Available to Foster?"
        name: "foster"
        widget: "boolean"
        default: true
      - label: "Needs Donation?"
        name: "needs_donation"
        widget: "boolean"
        default: false
        hint: "Turn on if this animal needs medical/food funding"
      - label: "Needs Adoption?"
        name: "needs_adoption"
        widget: "boolean"
        default: true
      - label: "Photos"
        name: "photos"
        widget: "list"
        required: false
        field:
          label: "Photo"
          name: "photo"
          widget: "image"
      - label: "Videos"
        name: "videos"
        widget: "list"
        required: false
        field:
          label: "Video file path"
          name: "video"
          widget: "string"
          hint: "e.g. assets/images/uploads/my-video.mp4"
